[server]
# Match CV_DATASET_ZIP_MAX_MB (in MB). Streamlit default is 200MB.
maxUploadSize = 102400
# Local: serve at http://localhost:8501/
# AWS/EKS: --server.baseUrlPath=/cv in compose/Helm (ALB path prefix).
enableCORS = false
enableXsrfProtection = false
headless = true

[browser]
gatherUsageStats = false

