# Full stack — pull MLAir images (no git clone). CV builds from this repo.
#
#   cp .env.docker.example .env
#   docker compose pull
#   docker compose up -d
#
# Images: ghcr.io/phu142857/ml-air-{api,scheduler,executor,frontend,realtime}:latest

name: cv-mlair-stack

services:
  postgres:
    image: postgres:16
    container_name: ml-air-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlair}
      POSTGRES_DB: ${POSTGRES_DB:-mlair}
    ports:
      - "${ML_AIR_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ml_air_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlair -d mlair"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ml-air-redis
    ports:
      - "${ML_AIR_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: chown artifact volumes before first api start (see also api entrypoint chown each restart).
  mlair-artifact-init:
    image: docker.io/library/alpine:3.20
    user: "0:0"
    volumes:
      - ml_air_dataset_artifacts:/datasets
      - ml_air_model_artifacts:/models
      - cv_workload_artifacts:/cv-artifacts
    command:
      - sh
      - -c
      - |
        mkdir -p /datasets /models /cv-artifacts/jobs /cv-artifacts/uploads /cv-artifacts/mlair_pipeline_runs
        mkdir -p /datasets/cv-runtime-frames
        chown -R 1000:1000 /datasets /models /cv-artifacts
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.mlair-api-cv-plugins
      args:
        MLAIR_API_IMAGE: ${MLAIR_REGISTRY:-ghcr.io/phu142857}/ml-air-api:${MLAIR_TAG:-latest}
    image: ${MLAIR_API_CV_IMAGE:-ml-air-api:cv-workload}
    pull_policy: build
    container_name: ml-air-api
    # appuser (1000). Do not call ml-air docker-entrypoint.sh here — it uses runuser and
    # fails under rootless podman / when the process is already non-root.
    # Artifact perms: mlair-artifact-init chowns volumes before api starts.
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /mlair/artifacts/models /mlair/artifacts/datasets
        cd /app
        alembic upgrade head
        exec uvicorn main:app --host 0.0.0.0 --port 8080
    environment:
      ML_AIR_REDIS_URL: redis://redis:6379/0
      ML_AIR_DATABASE_URL: postgresql://mlair:mlair@postgres:5432/mlair
      ML_AIR_JWT_HS256_SECRET: ${ML_AIR_JWT_HS256_SECRET:-mlair-dev-jwt-secret-32bytes-minimum-key}
      ML_AIR_TRACKING_TOKEN: ${ML_AIR_TRACKING_TOKEN:-admin-token}
      ML_AIR_SKIP_APPROVAL_FOR_PROMOTE: ${ML_AIR_SKIP_APPROVAL_FOR_PROMOTE:-1}
      ML_AIR_MANIFEST_SIGNING_KEY: ${ML_AIR_MANIFEST_SIGNING_KEY:-mlair-dev-manifest-signing-key}
      ML_AIR_MANIFEST_ACTIVE_KEY_ID: ${ML_AIR_MANIFEST_ACTIVE_KEY_ID:-v1}
      ML_AIR_DATASET_ARTIFACT_ROOT: file:///mlair/artifacts/datasets
      ML_AIR_DEFAULT_MODEL_ARTIFACT_ROOT: file:///mlair/artifacts/models
      ML_AIR_HTTP_TASK_ALLOWED_HOSTS: ${ML_AIR_HTTP_TASK_ALLOWED_HOSTS:-cv-api,cv-lifecycle-api,api,localhost,127.0.0.1,host.docker.internal}
      MLAIR_MODEL_PROMOTE_WEBHOOK_URL: ${MLAIR_MODEL_PROMOTE_WEBHOOK_URL:-http://cv-api:8000/api/v1/mlair/promote-webhook}
      MLAIR_MODEL_PROMOTE_WEBHOOK_BEARER_TOKEN: ${MLAIR_MODEL_PROMOTE_WEBHOOK_BEARER_TOKEN:-${CV_MLAIR_PROMOTE_WEBHOOK_TOKEN:-admin-token}}
      MLAIR_MODEL_PROMOTE_WEBHOOK_TIMEOUT_SECONDS: ${MLAIR_MODEL_PROMOTE_WEBHOOK_TIMEOUT_SECONDS:-30}
      MLAIR_REALTIME_ENABLED: ${MLAIR_REALTIME_ENABLED:-true}
      ML_AIR_RUNTIME_REALTIME_BASE_URL: ${ML_AIR_RUNTIME_REALTIME_BASE_URL:-ws://localhost:8001}
      ML_AIR_READINESS_ALLOW_LEGACY_FALLBACK: ${ML_AIR_READINESS_ALLOW_LEGACY_FALLBACK:-0}
      ML_AIR_STRICT_DATASET_VERSION_REQUIRED: ${ML_AIR_STRICT_DATASET_VERSION_REQUIRED:-1}
      ML_AIR_TASK_EXECUTION_MODE: ${ML_AIR_TASK_EXECUTION_MODE:-external}
      ML_AIR_TASK_LEASE_SECONDS: ${ML_AIR_TASK_LEASE_SECONDS:-300}
    ports:
      - "${ML_AIR_API_PORT:-8080}:8080"
    volumes:
      - ml_air_dataset_artifacts:/mlair/artifacts/datasets
      - ml_air_model_artifacts:/mlair/artifacts/models
    depends_on:
      mlair-artifact-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    restart: unless-stopped

  scheduler:
    image: ${MLAIR_REGISTRY:-ghcr.io/phu142857}/ml-air-scheduler:${MLAIR_TAG:-latest}
    pull_policy: always
    environment:
      ML_AIR_TASK_EXECUTION_MODE: ${ML_AIR_TASK_EXECUTION_MODE:-external}
      ML_AIR_REDIS_URL: redis://redis:6379/0
      ML_AIR_DATABASE_URL: postgresql://mlair:mlair@postgres:5432/mlair
      ML_AIR_MANIFEST_SIGNING_KEY: ${ML_AIR_MANIFEST_SIGNING_KEY:-mlair-dev-manifest-signing-key}
      ML_AIR_MANIFEST_ACTIVE_KEY_ID: ${ML_AIR_MANIFEST_ACTIVE_KEY_ID:-v1}
      MLAIR_REALTIME_ENABLED: ${MLAIR_REALTIME_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  realtime:
    image: ${MLAIR_REGISTRY:-ghcr.io/phu142857}/ml-air-realtime:${MLAIR_TAG:-latest}
    pull_policy: always
    container_name: ml-air-realtime
    environment:
      ML_AIR_REDIS_URL: redis://redis:6379/0
      ML_AIR_LOG_LEVEL: ${ML_AIR_LOG_LEVEL:-INFO}
      ML_AIR_JWT_HS256_SECRET: ${ML_AIR_JWT_HS256_SECRET:-mlair-dev-jwt-secret-32bytes-minimum-key}
      MLAIR_REALTIME_ENABLED: ${MLAIR_REALTIME_ENABLED:-true}
    ports:
      - "${MLAIR_REALTIME_PORT:-8001}:8001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  executor:
    image: ${MLAIR_REGISTRY:-ghcr.io/phu142857}/ml-air-executor:${MLAIR_TAG:-latest}
    pull_policy: always
    container_name: ml-air-executor
    environment:
      ML_AIR_REDIS_URL: redis://redis:6379/0
      ML_AIR_DATABASE_URL: postgresql://mlair:mlair@postgres:5432/mlair
      ML_AIR_API_BASE_URL: http://api:8080
      ML_AIR_TRACKING_TOKEN: ${ML_AIR_TRACKING_TOKEN:-admin-token}
      ML_AIR_MANIFEST_SIGNING_KEY: ${ML_AIR_MANIFEST_SIGNING_KEY:-mlair-dev-manifest-signing-key}
      ML_AIR_MANIFEST_ACTIVE_KEY_ID: ${ML_AIR_MANIFEST_ACTIVE_KEY_ID:-v1}
      ML_AIR_HTTP_TASK_ALLOWED_HOSTS: cv-api,cv-lifecycle-api,localhost,127.0.0.1
      ML_AIR_HTTP_TASK_TEMPLATES: "1"
      CV_MLAIR_TRAIN_CALLBACK_TOKEN: ${CV_MLAIR_TRAIN_CALLBACK_TOKEN:-admin-token}
      CV_MLAIR_PROMOTE_WEBHOOK_TOKEN: ${CV_MLAIR_PROMOTE_WEBHOOK_TOKEN:-admin-token}
      CV_MLAIR_SYNC_ON_HUB_PROMOTE: ${CV_MLAIR_SYNC_ON_HUB_PROMOTE:-1}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Leases cv_yolo_train plugin tasks (Hub Train requires tasks[].plugin in pipeline config).
  mlair-cv-train-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${CV_IMAGE:-cv-lifecycle-workload:latest}
    container_name: mlair-cv-train-worker
    command: python scripts/mlair_cv_pipeline_worker.py
    environment:
      PYTHONPATH: /app
      MLAIR_API_BASE_URL: http://api:8080
      MLAIR_WORKER_TOKEN: ${ML_AIR_TRACKING_TOKEN:-admin-token}
      MLAIR_WORKER_ID: ${MLAIR_CV_TRAIN_WORKER_ID:-cv-lifecycle-worker}
      MLAIR_CAPABILITIES: cv_yolo_prepare,cv_yolo_train,cv_yolo_eval,cv_yolo_gate,cv_hard_example_mine
      CV_MLAIR_LIFECYCLE_IMPORT_STAGE: ${CV_MLAIR_LIFECYCLE_IMPORT_STAGE:-staging}
      CV_MLAIR_LIFECYCLE_AUTO_PROMOTE: ${CV_MLAIR_LIFECYCLE_AUTO_PROMOTE:-1}
      CV_MLAIR_GATE_MIN_MAP_DELTA: ${CV_MLAIR_GATE_MIN_MAP_DELTA:-0.0}
      CV_MLAIR_HARD_EXAMPLE_DATASET: ${CV_MLAIR_HARD_EXAMPLE_DATASET:-cv-traffic-hard-examples}
      CV_MLAIR_HARD_EXAMPLE_MAX_CONF: ${CV_MLAIR_HARD_EXAMPLE_MAX_CONF:-0.35}
      CV_MLAIR_PERSIST_INGEST_FRAMES: ${CV_MLAIR_PERSIST_INGEST_FRAMES:-1}
      MLAIR_HEARTBEAT_INTERVAL_SEC: ${MLAIR_HEARTBEAT_INTERVAL_SEC:-15}
      CV_MLAIR_TRAIN_EPOCHS: ${CV_MLAIR_TRAIN_EPOCHS:-10}
      CV_ARTIFACT_ROOT: /app/artifacts
      CV_API_BASE_URL: http://cv-api:8000
      CV_MLAIR_API_URL: http://api:8080
      CV_MLAIR_TOKEN: ${CV_MLAIR_TOKEN:-admin-token}
      CV_MLAIR_TENANT: ${CV_MLAIR_TENANT:-default}
      CV_MLAIR_PROJECT: ${CV_MLAIR_PROJECT:-default_project}
      CV_MLAIR_MODEL_ARTIFACT_MOUNT: /mlair/artifacts
    volumes:
      - cv_workload_artifacts:/app/artifacts
      - ./weights:/app/weights
      - ./mlair_adapter:/app/mlair_adapter:ro
      - ./scripts:/app/scripts:ro
      - ml_air_model_artifacts:/mlair/artifacts/models:ro
      - ml_air_dataset_artifacts:/mlair/artifacts/datasets
    depends_on:
      mlair-artifact-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      cv-api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${MLAIR_REGISTRY:-ghcr.io/phu142857}/ml-air-frontend:${MLAIR_TAG:-latest}
    pull_policy: always
    container_name: ml-air-frontend
    environment:
      MLAIR_NEXT_INTERNAL_API_URL: http://api:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ML_AIR_FRONTEND_PORT:-38080}:3000"
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
    restart: unless-stopped

  cv-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${CV_IMAGE:-cv-lifecycle-workload:latest}
    container_name: cv-lifecycle-api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment:
      PYTHONPATH: /app
      CV_ARTIFACT_ROOT: /app/artifacts
      CV_API_BASE_URL: http://cv-api:8000
      CV_MLAIR_API_URL: http://api:8080
      CV_MLAIR_TOKEN: ${CV_MLAIR_TOKEN:-admin-token}
      CV_MLAIR_TENANT: ${CV_MLAIR_TENANT:-default}
      CV_MLAIR_PROJECT: ${CV_MLAIR_PROJECT:-default_project}
      CV_MLAIR_DATASET_NAME: ${CV_MLAIR_DATASET_NAME:-cv-traffic-frames}
      CV_MLAIR_AUTO_INGEST: ${CV_MLAIR_AUTO_INGEST:-1}
      CV_MLAIR_AUTO_MATERIALIZE: ${CV_MLAIR_AUTO_MATERIALIZE:-1}
      CV_MLAIR_MODEL_ID: ${CV_MLAIR_MODEL_ID:-}
      CV_MLAIR_AUTO_TRAIN: ${CV_MLAIR_AUTO_TRAIN:-0}
      CV_MLAIR_TRAIN_PIPELINE_ID: ${CV_MLAIR_TRAIN_PIPELINE_ID:-cv-yolo-lifecycle-train}
      CV_MLAIR_PIPELINE_MODE: ${CV_MLAIR_PIPELINE_MODE:-plugin}
      CV_MLAIR_LIFECYCLE_IMPORT_STAGE: ${CV_MLAIR_LIFECYCLE_IMPORT_STAGE:-staging}
      CV_MLAIR_LIFECYCLE_AUTO_PROMOTE: ${CV_MLAIR_LIFECYCLE_AUTO_PROMOTE:-1}
      CV_MLAIR_GATE_MIN_MAP_DELTA: ${CV_MLAIR_GATE_MIN_MAP_DELTA:-0.0}
      CV_MLAIR_BOOTSTRAP_PIPELINE: ${CV_MLAIR_BOOTSTRAP_PIPELINE:-1}
      CV_MLAIR_TRAIN_CALLBACK_TOKEN: ${CV_MLAIR_TRAIN_CALLBACK_TOKEN:-admin-token}
      CV_MLAIR_PROMOTE_WEBHOOK_TOKEN: ${CV_MLAIR_PROMOTE_WEBHOOK_TOKEN:-admin-token}
      CV_MLAIR_SYNC_ON_HUB_PROMOTE: ${CV_MLAIR_SYNC_ON_HUB_PROMOTE:-1}
      CV_MLAIR_TRAIN_EPOCHS: ${CV_MLAIR_TRAIN_EPOCHS:-10}
      CV_MLAIR_AUTO_PROMOTE: ${CV_MLAIR_AUTO_PROMOTE:-0}
      CV_MLAIR_AUTO_SYNC_MODELS: ${CV_MLAIR_AUTO_SYNC_MODELS:-1}
      CV_MLAIR_SYNC_ON_STARTUP: ${CV_MLAIR_SYNC_ON_STARTUP:-1}
      CV_MLAIR_SYNC_AFTER_TRAIN: ${CV_MLAIR_SYNC_AFTER_TRAIN:-1}
      CV_MLAIR_SYNC_INTERVAL_SEC: ${CV_MLAIR_SYNC_INTERVAL_SEC:-300}
      CV_MLAIR_REGISTRY_RESYNC_SECONDS: ${CV_MLAIR_REGISTRY_RESYNC_SECONDS:-120}
      CV_MLAIR_REGISTRY_SYNC_AT_STARTUP: ${CV_MLAIR_REGISTRY_SYNC_AT_STARTUP:-1}
      CV_MLAIR_DISK_SYNC_MODE: ${CV_MLAIR_DISK_SYNC_MODE:-metadata}
      CV_MLAIR_DISK_IMPORT_ALL_VERSIONS: ${CV_MLAIR_DISK_IMPORT_ALL_VERSIONS:-0}
      CV_MLAIR_MIRROR_REGISTRY_TO_LOCAL: ${CV_MLAIR_MIRROR_REGISTRY_TO_LOCAL:-1}
      CV_MLAIR_MODEL_ARTIFACT_MOUNT: /mlair/artifacts
      CV_MLAIR_PERSIST_INGEST_FRAMES: ${CV_MLAIR_PERSIST_INGEST_FRAMES:-1}
      CV_PERSIST_JOBS: ${CV_PERSIST_JOBS:-1}
    volumes:
      - cv_workload_artifacts:/app/artifacts
      - ./weights:/app/weights
      - ml_air_model_artifacts:/mlair/artifacts/models:ro
      - ml_air_dataset_artifacts:/mlair/artifacts/datasets
    ports:
      - "${CV_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 180s
    depends_on:
      mlair-artifact-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped

  cv-ui:
    image: ${CV_IMAGE:-cv-lifecycle-workload:latest}
    container_name: cv-lifecycle-ui
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0 --browser.gatherUsageStats=false
    environment:
      PYTHONPATH: /app
      CV_API_BASE_URL: http://cv-api:8000
      CV_MLAIR_HUB_URL: ${CV_MLAIR_HUB_URL:-http://localhost:38080}
      CV_CLIENT_SAVE_TO_DATASET: ${CV_CLIENT_SAVE_TO_DATASET:-1}
    volumes:
      - ./weights:/app/weights:ro
    ports:
      - "${CV_UI_PORT:-8501}:8501"
    depends_on:
      cv-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ml_air_pgdata:
  ml_air_dataset_artifacts:
  ml_air_model_artifacts:
  # CV jobs/uploads/pipeline state — shared by cv-api + train worker (not ./artifacts on host).
  cv_workload_artifacts:
