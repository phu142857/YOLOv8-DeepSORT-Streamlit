apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mlair-stack.fullname" . }}-secrets
  labels:
    {{- include "mlair-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  ML_AIR_DATABASE_URL: {{ required "global.databaseUrl is required" .Values.global.databaseUrl | quote }}
  ML_AIR_REDIS_URL: {{ required "global.redisUrl is required" .Values.global.redisUrl | quote }}
  ML_AIR_JWT_HS256_SECRET: {{ required "global.jwtSecret is required" .Values.global.jwtSecret | quote }}
  ML_AIR_MANIFEST_SIGNING_KEY: {{ required "global.manifestSigningKey is required" .Values.global.manifestSigningKey | quote }}
  ML_AIR_TRACKING_TOKEN: {{ required "global.trackingToken is required" .Values.global.trackingToken | quote }}
  ML_AIR_AUTH_TOKENS_JSON: {{ required "global.authTokensJson is required" .Values.global.authTokensJson | quote }}
  CV_MLAIR_TOKEN: {{ required "global.cvMlairToken is required" .Values.global.cvMlairToken | quote }}
