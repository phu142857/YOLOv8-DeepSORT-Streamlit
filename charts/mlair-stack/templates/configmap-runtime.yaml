apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mlair-stack.fullname" . }}-runtime-config
  labels:
    {{- include "mlair-stack.labels" . | nindent 4 }}
data:
  mlair-runtime-config.js: |
    // Generated by Helm — browser API/WS URLs via ALB (not localhost).
    window.__ML_AIR_RUNTIME_CONFIG__ = {
      environment: "aws",
      api_base_url: {{ required "global.publicBaseUrl is required" .Values.global.publicBaseUrl | quote }},
      realtime_base_url: {{ required "global.realtimeWsUrl is required" .Values.global.realtimeWsUrl | quote }},
      default_tenant_hint: {{ .Values.global.tenantId | quote }},
      default_project_hint: {{ .Values.global.projectId | quote }},
      hub_default_route: "datasets",
      features: {}
    };
