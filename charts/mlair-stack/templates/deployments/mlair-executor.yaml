{{- if .Values.mlairExecutor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mlair-stack.serviceName" (dict "service" "mlair-executor" "Release" .Release "Chart" .Chart "Values" .Values) }}
  labels:
    {{- include "mlair-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mlairExecutor.replicas }}
  selector:
    matchLabels:
      {{- include "mlair-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mlair-executor
  template:
    metadata:
      labels:
        {{- include "mlair-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mlair-executor
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: mlair-executor
          image: {{ include "mlair-stack.mlairCoreImage" (dict "Values" .Values "name" "ml-air-executor" ) | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: ML_AIR_REDIS_URL
              valueFrom: {secretKeyRef: {name: {{ include "mlair-stack.fullname" . }}-secrets, key: ML_AIR_REDIS_URL}}
            - name: ML_AIR_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ include "mlair-stack.fullname" . }}-secrets, key: ML_AIR_DATABASE_URL}}
            - name: ML_AIR_JWT_HS256_SECRET
              valueFrom: {secretKeyRef: {name: {{ include "mlair-stack.fullname" . }}-secrets, key: ML_AIR_JWT_HS256_SECRET}}
            - name: ML_AIR_AUTH_TOKENS_JSON
              valueFrom: {secretKeyRef: {name: {{ include "mlair-stack.fullname" . }}-secrets, key: ML_AIR_AUTH_TOKENS_JSON}}
            - name: ML_AIR_API_BASE_URL
              value: "http://mlair-api:8080"
            - name: ML_AIR_TRACKING_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "mlair-stack.fullname" . }}-secrets, key: ML_AIR_TRACKING_TOKEN}}
            - name: ML_AIR_MANIFEST_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: {{ include "mlair-stack.fullname" . }}-secrets, key: ML_AIR_MANIFEST_SIGNING_KEY}}
            - name: ML_AIR_MANIFEST_ACTIVE_KEY_ID
              value: "v1"
            - name: CV_MLAIR_TRAIN_CALLBACK_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "mlair-stack.fullname" . }}-secrets, key: ML_AIR_TRACKING_TOKEN}}
            - name: CV_MLAIR_PROMOTE_WEBHOOK_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "mlair-stack.fullname" . }}-secrets, key: ML_AIR_TRACKING_TOKEN}}
          resources:
            {{- toYaml .Values.mlairExecutor.resources | nindent 12 }}
{{- end }}
