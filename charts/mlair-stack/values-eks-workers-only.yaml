# Hybrid EKS profile: autoscale train workers on Kubernetes; Hub/API stay on EC2 (ALB).
ingress:
  enabled: false

mlairApi:
  enabled: false
mlairScheduler:
  enabled: false
mlairExecutor:
  enabled: false
mlairRealtime:
  enabled: false
mlairFrontend:
  enabled: false
cvApi:
  enabled: false
cvUi:
  enabled: false

cvTrainWorker:
  enabled: true
  # Default 1 worker; scale up for parallel-task QA via CV_TRAIN_WORKER_MIN_REPLICAS=4
  # or overlay values-eks-4-worker-pool.yaml.
  replicas: 1

autoscaling:
  hpa:
    enabled: true
    minReplicas: 1
    # Reactive burst capacity (CPU-based until KEDA queue scaling — Phase 2).
    maxReplicas: 16
